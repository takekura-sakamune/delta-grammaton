<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF READER | デルタグラマトン</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="reader.css?v=4"></head>
<body class="reader"><div class="reader-top"><header class="reader-header"><a href="index.html#works">← 作品一覧</a><strong>PDF READER</strong><span>DELTA GRAMMATON</span></header>
<div class="reader-settings"><h1 id="title">作品を読む</h1><div class="reader-toolbar"><label>公開作品 <select id="books"><option value="">作品を選択</option></select></label><label class="file-button">手元のPDFを開く<input id="file" type="file" accept="application/pdf,.pdf"></label><label>表示 <select id="mode"><option value="single">単ページ</option><option value="spread" selected>見開き</option></select></label><label><input id="cover" type="checkbox">先頭1ページを単独表示</label></div>
<p class="reader-help">右綴じ：←・↓・下スクロール 次へ ／ →・↑・上スクロール 前へ　｜　画面下部でページ移動・拡大縮小（タッチ時はPDFをタップ）｜ 拡大中の移動：Shift＋スクロール</p></div></div><main class="reader-main"><p id="status" role="status" aria-live="polite">PDFを読み込んでいます…。手元のファイルはアップロードされません。</p>
<div id="stage" class="page-stage" aria-label="PDFページ" aria-busy="false"><div id="pages" class="pdf-pages"></div></div>
<div class="edge-zone edge-left"><button id="next" type="button" disabled aria-label="次のページ">←<span>次へ</span></button></div>
<div class="edge-zone edge-right"><button id="previous" type="button" disabled aria-label="前のページ">→<span>前へ</span></button></div>
<div class="page-controls" aria-label="ページと倍率の操作"><div class="control-row"><output id="count" for="position">— / —</output><div class="zoom-controls"><button id="zoom-out" type="button" aria-label="縮小">−</button><label for="zoom">拡大率</label><input id="zoom" type="number" min="50" max="300" step="10" value="100" inputmode="numeric"><span>%</span><button id="zoom-in" type="button" aria-label="拡大">＋</button><button id="zoom-reset" type="button">画面に合わせる</button></div></div><label class="slider-label" for="position">ページ移動</label><input id="position" type="range" min="1" max="1" value="1" disabled aria-label="ページ移動"></div>
<noscript>PDFを読むにはJavaScriptを有効にしてください。</noscript></main><script data-goatcounter="https://deltagrammaton.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script><script defer src="reader.js?v=5"></script></body></html>
